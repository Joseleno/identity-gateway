# Ambiente de desenvolvimento completo: a API, as dependências de que ela precisa (banco, cache, Keycloak e um SMTP
# de desenvolvimento) e as ferramentas para enxergar o que ela faz. `docker compose up` e a aplicação está no ar
# com logs e traces navegáveis.
#
# NÃO É PRODUÇÃO. As senhas estão em texto aberto porque são de um banco descartável em máquina local. Em produção,
# tudo isto vem do cofre do provedor.
#
# O Keycloak também não: `start-dev`, http e chave gerada em volume são de desenvolvimento. Em produção, o KC_HOSTNAME
# é o endereço público do Keycloak, e a Gateway o recebe em Keycloak:Admin:PublicBaseUrl — é o aud do client assertion;
# o BaseUrl, por onde ela chama o token endpoint e a Admin API, pode ser o endereço interno. A chave vem do cofre como
# arquivo montado, e a Api recusa http e AllowInsecureHttp fora de Development.
#
# QUEM JÁ TINHA VOLUMES DE ANTES DOS TOKENS DO KEYCLOAK PRECISA DE `docker compose down -v`, e depois
# `docker compose up -d --build`: o realm só é importado na primeira subida, e num volume antigo faltam os scopes da
# Gateway, o client de demonstração, o catálogo de papéis e o platform-admin. O serviço platform-admin-invite acusa
# isso e sai com 1, e a api não sobe — em vez de subir e responder 401 a todo token. (Volume de antes do convite do
# admin inicial: o /health/ready da Api acusa a falta do manage-users.)
#
# O PRIMEIRO PLATFORM-ADMIN nasce sem senha, no import do realm, com o e-mail de PLATFORM_ADMIN_EMAIL. O serviço
# platform-admin-invite manda o convite UMA vez, para o mailpit (http://localhost:8025); o link vale 4 h. Para mandar
# outro: docker compose run --rm -e REENVIAR=1 platform-admin-invite. Não troque nem apague o admin do master do
# Keycloak: o platform-admin-invite faz login com ele a cada subida. Se mudou, docker compose down -v.
#
# Chave e realm andam juntos: o realm é importado só na primeira subida. Apagar SÓ o volume gateway-keys gera uma
# chave que o realm não conhece, e o /health/ready da Api acusa invalid_client. Para recomeçar: docker compose down -v.
#
# Nota: a suíte de testes NÃO depende deste arquivo. Os testes sobem os próprios containers via Testcontainers —
# é o que permite rodar `dotnet test` num clone novo sem subir nada antes.

# Compartilhados pela api e pelo migrate, que são a mesma imagem: o que muda entre os dois é só a flag.
x-api-build: &api-build
  context: .
  dockerfile: Dockerfile

# Os nomes dos serviços são resolvidos pelo DNS interno do compose — "postgres" e "redis" só existem nesta
# rede. Por isso a connection string daqui não vale fora dela.
x-database: &database
  Database__ConnectionString: "Host=postgres;Port=5432;Database=identitygateway;Username=postgres;Password=postgres"

# O e-mail do primeiro platform-admin, compartilhado pelo keycloak (que o grava no import do realm) e pelo
# platform-admin-invite (que o procura). Em minúsculas: o Keycloak grava o e-mail assim, e o entrypoint do keycloak
# recusa outra coisa. Fixado no primeiro import: mudar depois exige docker compose down -v.
x-platform-admin: &platform-admin
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform-admin@identity-gateway.local}

services:
  api:
    build: *api-build
    ports:
      # Só em 127.0.0.1: agora circulam tokens de verdade por aqui.
      - "127.0.0.1:8080:8080"
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: "redis:6379"

      # Traces e métricas vão para o Jaeger via OTLP.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "identitygateway-api"

      # Sobrescreve o endereço do Seq definido no appsettings.Development.json: dentro da rede do compose o
      # serviço é alcançado pelo nome, e "localhost" apontaria para o próprio contêiner da API.
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"

      # Transporte: a api chama o token endpoint e a Admin API, e busca os metadados e as chaves que validam os
      # tokens, pelo nome do serviço, dentro da rede do compose.
      Keycloak__Admin__BaseUrl: "http://keycloak:8080"
      # Endereço público, nunca discado: é o aud do client assertion E o emissor que a api aceita nos tokens. Igual
      # ao KC_HOSTNAME do keycloak (um teste de arquitetura confere); sem ele o emissor seria keycloak:8080, o
      # Keycloak responderia "Invalid token audience" e todo token de usuário levaria 401. A lista de clients aceitos
      # (azp) vem do appsettings.Development.json: só o identity-gateway-demo.
      Keycloak__Admin__PublicBaseUrl: "http://localhost:8081"
      Keycloak__Admin__PrivateKeyPath: "/keys/private.pem"
    volumes:
      - type: volume
        source: gateway-keys
        target: /keys
        read_only: true
        volume:
          subpath: api
    depends_on:
      # A api só sobe sobre o schema migrado. Uma migration que falha segura a api, em vez de deixá-la servir
      # sobre as tabelas antigas — ou sobre nenhuma, num volume novo.
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Conveniência de desenvolvimento, para o primeiro curl funcionar. Não é garantia: a Api responde com o
      # Keycloak parado, e é o provisionamento que espera por ele.
      keycloak:
        condition: service_healthy
      gateway-keys:
        condition: service_completed_successfully
      # O convite do primeiro platform-admin. Além de mandar o e-mail na primeira subida, ele confere que o realm é o
      # desta versão: com um volume antigo, sai com 1 e a api não sobe — o erro aparece no `up`, com a causa no log
      # dele, em vez de a api subir e todo token levar 401.
      platform-admin-invite:
        condition: service_completed_successfully
    healthcheck:
      # O /health/ready de verdade: Postgres, Redis e o token do service account no Keycloak. A imagem
      # mcr.microsoft.com/dotnet/aspnet:10.0 é Ubuntu 24.04 e tem bash; sem curl, a requisição sai por /dev/tcp.
      test: ["CMD", "bash", "-c", "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q ' 200 '; } 0<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: aplica as migrations pendentes e encerra. É a imagem da api com --migrate — o mesmo passo que, em
  # produção, roda uma vez no deploy (init container ou pipeline) antes das réplicas novas. A api nunca migra ao
  # subir (ver StartupTasks): com várias réplicas, todas tentariam migrar o mesmo banco ao mesmo tempo.
  #
  # Idempotente: sobre um banco já migrado, não há migration pendente e ele sai com 0.
  migrate:
    build: *api-build
    command: ["--migrate"]
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      # `service_healthy` e não apenas `service_started`: o contêiner do Postgres aceita conexão segundos depois
      # de iniciar, e sem esperar o health check a migration falharia antes de o banco responder.
      postgres:
        condition: service_healthy

  # One-shot: gera, só na primeira subida, o par de chaves da Gateway e a senha do admin master do Keycloak.
  #
  # Script INLINE, e não um .sh montado: o .editorconfig deste repositório define CRLF, e um script montado por bind
  # mount chegaria ao contêiner com \r. `$$` é o `$` literal para o compose.
  #
  # Geração atômica: tudo nasce em .tmp e é movido no fim; o marcador .complete é gravado por último. Sem ele, a
  # geração recomeça do zero — nunca fica meio par.
  gateway-keys:
    image: alpine:3.22
    volumes:
      - gateway-keys:/keys
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        if [ -f /keys/.complete ]; then echo "gateway-keys: chaves já existem"; exit 0; fi
        apk add --no-cache openssl > /dev/null
        rm -rf /keys/.tmp /keys/api /keys/keycloak
        mkdir -p /keys/.tmp/api /keys/.tmp/keycloak
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/.tmp/api/private.pem
        openssl req -new -x509 -key /keys/.tmp/api/private.pem -subj "/CN=identity-gateway" -days 3650 -outform DER -out /keys/.tmp/cert.der
        openssl base64 -A -in /keys/.tmp/cert.der > /keys/.tmp/keycloak/cert.b64
        openssl rand -base64 24 | tr -d '\n' > /keys/.tmp/keycloak/admin-password
        # 1654 é o usuário "app" da imagem aspnet (Dockerfile); 1000, o do Keycloak. Cada um lê só a sua pasta.
        chown -R 1654:1654 /keys/.tmp/api && chmod 0500 /keys/.tmp/api && chmod 0400 /keys/.tmp/api/private.pem
        chown -R 1000:1000 /keys/.tmp/keycloak && chmod 0500 /keys/.tmp/keycloak
        chmod 0444 /keys/.tmp/keycloak/cert.b64 && chmod 0400 /keys/.tmp/keycloak/admin-password
        mv /keys/.tmp/api /keys/api && mv /keys/.tmp/keycloak /keys/keycloak && rm -rf /keys/.tmp
        touch /keys/.complete
        echo "gateway-keys: senha do admin master do Keycloak (exibida só nesta subida): $$(cat /keys/keycloak/admin-password)"

  # One-shot: cria o banco do Keycloak se ele não existir. Não é script de initdb porque o initdb só roda com o
  # volume vazio — e quebraria quem já tem o postgres-data.
  keycloak-db:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1; then
          echo "keycloak-db: banco já existe"
        else
          psql -h postgres -U postgres -c "CREATE DATABASE keycloak"
        fi
    depends_on:
      postgres:
        condition: service_healthy

  # Console em http://localhost:8081 (usuário admin; senha no log do gateway-keys). Publicado só em 127.0.0.1: o
  # admin master manda no Keycloak inteiro, e não fica exposto à rede local.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # O ENTRYPOINT da imagem é o kc.sh, então a troca vai em `entrypoint`, não em `command`. `test -s` e `test -n`
    # falham cedo se o arquivo ou a variável faltarem: um placeholder sem valor seria gravado no realm como texto
    # literal, sem erro, e só falharia na autenticação ou no primeiro e-mail. `exec` para o kc.sh receber o SIGTERM.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -s /keys/cert.b64 && test -s /keys/admin-password &&
        test -n "$$SMTP_HOST" && test -n "$$SMTP_PORT" && test -n "$$SMTP_FROM" &&
        test -n "$$PLATFORM_ADMIN_EMAIL" &&
        test "$$PLATFORM_ADMIN_EMAIL" = "$$(printf '%s' "$$PLATFORM_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')" &&
        export GATEWAY_CLIENT_CERT="$$(cat /keys/cert.b64)" KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /keys/admin-password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      # O ${PLATFORM_ADMIN_EMAIL} do realm. Conferido no entrypoint: vazio, o import gravaria o placeholder literal;
      # com maiúsculas, o Keycloak gravaria em minúsculas um e-mail diferente do configurado.
      <<: *platform-admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      # Endereço público: o link do e-mail, o iss e o discovery usam localhost:8081, mesmo com a requisição chegando
      # por keycloak:8080 — e a Admin API continua respondendo pelo nome do serviço (backchannel dinâmico).
      # 127.0.0.1 no lugar de localhost quebraria o aud do assertion, comparado por texto.
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Lidos pelo smtpServer do realm, sem o prefixo KC_ (que o Keycloak leria como opção dele). Plugar outro servidor
      # — ou o notification-hub, quando ele aceitar SMTP — é trocar estes três valores.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: convites@identity-gateway.local
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: volume
        source: gateway-keys
        target: /keys
        read_only: true
        volume:
          subpath: keycloak
      - ./keycloak/bootstrap:/opt/keycloak/data/import:ro
    healthcheck:
      # Sem curl na imagem: o comando é o do guia oficial de health do Keycloak, na porta de gestão 9000. Testa o
      # /health/ready e não só a porta — com health ligado, as portas abrem antes de o servidor estar pronto.
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    depends_on:
      gateway-keys:
        condition: service_completed_successfully
      keycloak-db:
        condition: service_completed_successfully
      # O SMTP do convite precisa responder quando o primeiro tenant for provisionado.
      mailpit:
        condition: service_healthy

  # One-shot: manda, UMA vez, o e-mail de convite do primeiro platform-admin — a conta nasce sem senha no import do
  # realm, e é pelo link deste e-mail (4 h) que ela define a senha. Sobe depois do keycloak saudável, e a api depende
  # dele.
  #
  # Reenvio, só por comando explícito: docker compose run --rm -e REENVIAR=1 platform-admin-invite
  # (recusa se o convite já foi concluído; os links anteriores ainda não usados continuam válidos até expirar).
  #
  # A imagem é a do Keycloak, pelo kcadm.sh oficial — ela não tem jq, awk nem python: as respostas são lidas com sed e
  # grep, do JSON indentado (uma chave por linha). Toda leitura de attributes é SEM --fields: com ele, o objeto vem
  # vazio, e as travas do marcador e do tenant_id ficariam vacuosas.
  #
  # A credencial é a do admin do MASTER, lida do arquivo dentro do sh — nunca uma variável declarada aqui, que ficaria
  # no docker inspect. Nunca a chave da Gateway: com o manage-users dela, a criação do platform-admin apareceria nos
  # eventos de administração como obra da Gateway. Sem -x, e nenhuma resposta do kcadm é ecoada.
  #
  # O que ele NUNCA faz: atribuir papel. A conta que não tiver exatamente a forma do bootstrap (só platform-admin, sem
  # papel de client, sem tenant_id, sem grupo) faz o serviço sair com 1.
  #
  # O marcador do envio é um atributo do realm (platformAdminInviteSentAt), gravado ANTES do envio: no máximo um link
  # automático, mesmo que o envio falhe — nesse caso, o convite só sai pelo reenvio.
  platform-admin-invite:
    image: quay.io/keycloak/keycloak:26.7.4
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        kcadm=/opt/keycloak/bin/kcadm.sh
        config=/tmp/kcadm.config
        realm=identity-gateway
        email="$$(printf '%s' "$$PLATFORM_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')"
        falhar() { echo "platform-admin-invite: $$1" >&2; exit 1; }
        trap 'rm -f /tmp/kcadm.config' EXIT
        KC_CLI_PASSWORD="$$(cat /keys/admin-password)"; export KC_CLI_PASSWORD
        kc() { "$$kcadm" "$$@" --config "$$config" 2>/dev/null; }

        # 0. Login no master, antes de tudo.
        kc config credentials --server http://keycloak:8080 --realm master --user admin > /dev/null \
          || falhar "credencial do master recusada: o admin do compose foi alterado? Rode: docker compose down -v"

        # Cada leitura vai primeiro para uma variável, com o próprio "|| falhar": num pipe, o status é o do último
        # comando, e uma leitura que falhasse viraria "não achei" — marcador vazio, e um segundo convite enviado.

        # 1. O realm é o desta versão?
        scopes="$$(kc get client-scopes -r "$$realm" --fields name)" \
          || falhar "não foi possível listar os client scopes do realm"
        printf '%s\n' "$$scopes" | grep -q '"name" : "gateway-api"' \
          || falhar "realm anterior aos tokens do Keycloak (o import é IGNORE_EXISTING). Rode: docker compose down -v"

        # 2. O marcador (sem --fields: com ele, attributes viria vazio).
        dados_do_realm="$$(kc get "realms/$$realm")" || falhar "não foi possível ler o realm"
        marcador="$$(printf '%s\n' "$$dados_do_realm" | sed -n 's/^ *"platformAdminInviteSentAt" : "\([^"]*\)".*$$/\1/p' | head -n 1)"
        if [ -n "$$marcador" ] && [ "$${REENVIAR:-0}" != "1" ]; then
          echo "platform-admin-invite: convite já enviado em $$marcador; nada a fazer"
          exit 0
        fi

        # 3. Exatamente um usuário com o e-mail, e com a forma do bootstrap.
        achados="$$(kc get users -r "$$realm" -q "email=$$email" -q exact=true --fields id)" \
          || falhar "não foi possível procurar a conta do platform-admin"
        ids="$$(printf '%s\n' "$$achados" | sed -n 's/^ *"id" : "\([^"]*\)".*$$/\1/p')"
        [ "$$(printf '%s\n' "$$ids" | grep -c .)" = "1" ] || falhar "esperado exatamente um usuário com o e-mail do platform-admin"
        id="$$ids"
        usuario="$$(kc get "users/$$id" -r "$$realm")" || falhar "não foi possível ler a conta do platform-admin"
        papeis="$$(kc get "users/$$id/role-mappings" -r "$$realm")" || falhar "não foi possível ler os papéis da conta"
        grupos="$$(kc get "users/$$id/groups" -r "$$realm")" || falhar "não foi possível ler os grupos da conta"
        gravado="$$(printf '%s\n' "$$usuario" | sed -n 's/^ *"email" : "\([^"]*\)".*$$/\1/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
        nomes="$$(printf '%s\n' "$$papeis" | sed -n 's/^ *"name" : "\([^"]*\)".*$$/\1/p')"
        [ "$$gravado" = "$$email" ] || falhar "a conta do platform-admin não tem a forma do bootstrap"
        [ "$$nomes" = "platform-admin" ] || falhar "a conta do platform-admin não tem a forma do bootstrap"
        if printf '%s\n' "$$papeis" | grep -q '"clientMappings"'; then falhar "a conta do platform-admin não tem a forma do bootstrap"; fi
        if printf '%s\n' "$$usuario" | grep -q '"tenant_id"'; then falhar "a conta do platform-admin não tem a forma do bootstrap"; fi
        if printf '%s\n' "$$grupos" | grep -q '"id"'; then falhar "a conta do platform-admin não tem a forma do bootstrap"; fi

        # 4. Convite já concluído?
        if ! printf '%s\n' "$$usuario" | grep '"requiredActions"' | grep -q '"UPDATE_PASSWORD"'; then
          if [ "$${REENVIAR:-0}" = "1" ]; then falhar "o convite já foi concluído; não há o que reenviar"; fi
          echo "platform-admin-invite: convite já concluído; nada a enviar"
          exit 0
        fi

        # 5. Marcador ANTES do envio; depois, o e-mail (4 h).
        agora="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        kc update "realms/$$realm" -s "attributes.platformAdminInviteSentAt=$$agora" > /dev/null \
          || falhar "não foi possível gravar o marcador do convite no realm"
        if [ "$${REENVIAR:-0}" = "1" ]; then
          echo "platform-admin-invite: os links anteriores ainda não usados continuam válidos até expirar"
        fi
        kc update "users/$$id/execute-actions-email" -r "$$realm" -q lifespan=14400 -n -b '["UPDATE_PASSWORD","VERIFY_EMAIL"]' > /dev/null \
          || falhar "o envio do convite falhou. Reenvie com: docker compose run --rm -e REENVIAR=1 platform-admin-invite"
        echo "platform-admin-invite: convite enviado (o link vale 4 h)"
    environment:
      <<: *platform-admin
    volumes:
      - type: volume
        source: gateway-keys
        target: /keys
        read_only: true
        volume:
          subpath: keycloak
    depends_on:
      keycloak:
        condition: service_healthy

  # E-mail de desenvolvimento, em http://localhost:8025: o Keycloak envia para cá o convite do admin inicial. O SMTP
  # (1025) só existe na rede do compose, sem porta publicada; a interface e a API ficam só em 127.0.0.1, porque os
  # e-mails trazem links que trocam a senha do convidado.
  mailpit:
    # Fixada na release v1.31.3 (2026-09-27, conferida no Docker Hub e nas releases do GitHub). A mesma tag está no
    # KeycloakFixture dos testes, e um teste de arquitetura confere as duas.
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      # O subcomando readyz da própria imagem — é o healthcheck embutido dela —, que consulta o /readyz do servidor.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identitygateway
    ports:
      # Só em 127.0.0.1: uma ferramenta de banco na máquina alcança o contêiner, a rede local não — a tabela de
      # tenants guarda o e-mail do admin até a ativação.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitygateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Logs estruturados navegáveis, em http://localhost:5341. A API já envia para cá — o sink está configurado no
  # appsettings.Development.json, e o endereço é sobrescrito acima para o nome do serviço na rede do compose.
  #
  # Filtrar por CorrelationId aqui é o que liga uma reclamação de usuário à requisição exata que falhou.
  seq:
    # Fixado na versão que "latest" resolvia em 2026-09-24 (label org.opencontainers.image.version do próprio
    # datalust/seq:latest — a listagem de tags do Docker Hub confirma que é este o número, não "24.04", que o
    # label também imprime mas não corresponde a nenhuma tag publicada).
    image: datalust/seq:2026.1.17182
    environment:
      ACCEPT_EULA: "Y"
      # Versões recentes do Seq exigem senha de admin (ou esta opção) para subir. Ambiente local, sem autenticação.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Só em 127.0.0.1: os logs de falha podem trazer dado pessoal.
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data

  # Traces. A interface fica em http://localhost:16686 — é onde se vê a requisição, os comandos SQL dentro dela
  # e quanto tempo cada um levou.
  jaeger:
    # Fixado por digest, e não por tag: jaegertracing/all-in-one:latest não carrega o label de versão (a imagem não
    # tem nenhum label OCI), então não há tag textual confiável para fixar. Digest resolvido em 2026-09-24.
    image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Só em 127.0.0.1: os traces carregam as URLs das chamadas que a API faz e recebe.
      - "127.0.0.1:16686:16686"  # interface
      - "127.0.0.1:4317:4317"    # OTLP gRPC, que é o que a API usa

volumes:
  # Nomeados, e não montagem de pasta da máquina: o Postgres exige dono e permissões específicas do diretório de
  # dados, e uma montagem de pasta no Windows ou no macOS falha ou fica lenta por causa disso.
  postgres-data:
  seq-data:
  # Chaves da Gateway e senha do admin do Keycloak. Anda junto com o banco do Keycloak: ver o cabeçalho.
  gateway-keys:
